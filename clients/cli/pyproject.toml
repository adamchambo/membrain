[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-cli"
version = "0.1.0"
description = "Oracle local API terminal client"
requires-python = ">=3.10"
dependencies = ["oracle-sdk==0.1.0", "prompt-toolkit>=3.0.52,<4"]

[project.scripts]
oracle = "oracle_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["oracle_cli*"]
