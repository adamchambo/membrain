[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-cli"
version = "0.1.0"
description = "Oracle CLI navigation prototype with local stub responses"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
oracle = "oracle_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["oracle_cli*"]
