[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "membrain-cli"
version = "0.1.0"
description = "Membrain local API terminal client"
requires-python = ">=3.10"
dependencies = ["membrain-sdk==0.1.0", "prompt-toolkit>=3.0.52,<4"]

[project.scripts]
membrain = "membrain_cli.__main__:main"
oracle = "membrain_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["membrain_cli*"]
