# Existing database/user and volume identities are retained to preserve local data.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: oracle
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: "${MEMBRAIN_DB_PASSWORD:-${ORACLE_DB_PASSWORD:?Set MEMBRAIN_DB_PASSWORD in .env}}"
    volumes:
      - membrain_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment: &membrain_environment
      DATABASE_URL: "postgresql+psycopg://oracle:${MEMBRAIN_DB_PASSWORD:-${ORACLE_DB_PASSWORD:?Set MEMBRAIN_DB_PASSWORD in .env}}@db:5432/oracle"
      MEMBRAIN_CHAT_COMPLETIONS_URL: "${MEMBRAIN_CHAT_COMPLETIONS_URL:-${ORACLE_CHAT_COMPLETIONS_URL:-}}"
      MEMBRAIN_CHAT_MODEL: "${MEMBRAIN_CHAT_MODEL:-${ORACLE_CHAT_MODEL:-}}"
      MEMBRAIN_CHAT_API_KEY: "${MEMBRAIN_CHAT_API_KEY:-${ORACLE_CHAT_API_KEY:-}}"
      MEMBRAIN_EMBEDDINGS_URL: "${MEMBRAIN_EMBEDDINGS_URL:-${ORACLE_EMBEDDINGS_URL:-}}"
      MEMBRAIN_EMBEDDING_MODEL: "${MEMBRAIN_EMBEDDING_MODEL:-${ORACLE_EMBEDDING_MODEL:-nomic-embed-text-v1.5}}"
      MEMBRAIN_EMBEDDING_REVISION: "${MEMBRAIN_EMBEDDING_REVISION:-${ORACLE_EMBEDDING_REVISION:-}}"
      MEMBRAIN_EMBEDDING_DIMENSIONS: "${MEMBRAIN_EMBEDDING_DIMENSIONS:-${ORACLE_EMBEDDING_DIMENSIONS:-768}}"
      MEMBRAIN_EMBEDDING_DOCUMENT_PREFIX: "${MEMBRAIN_EMBEDDING_DOCUMENT_PREFIX-${ORACLE_EMBEDDING_DOCUMENT_PREFIX-search_document: }}"
      MEMBRAIN_EMBEDDING_QUERY_PREFIX: "${MEMBRAIN_EMBEDDING_QUERY_PREFIX-${ORACLE_EMBEDDING_QUERY_PREFIX-search_query: }}"
      MEMBRAIN_EMBEDDING_API_KEY: "${MEMBRAIN_EMBEDDING_API_KEY:-${ORACLE_EMBEDDING_API_KEY:-}}"
      MEMBRAIN_CONFIG_FILE: /var/lib/membrain/config.json
    volumes:
      - membrain_config:/var/lib/membrain
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: ./server
    environment: *membrain_environment
    volumes:
      - membrain_config:/var/lib/membrain
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.jobs.worker"]
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  membrain_postgres:
    name: oracle_oracle_postgres
  membrain_config:
    name: oracle_oracle_config
